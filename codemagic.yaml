workflows:
  ios-testflight:
    name: iOS TestFlight Build
    max_build_duration: 90
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Codemagic
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.adplay.app
      xcode: latest
      vars:
        BUNDLE_ID: "com.adplay.app"
        XCODE_PROJECT: AdPlay.xcodeproj
        XCODE_SCHEME: AdPlay
    scripts:
      - name: Install XcodeGen
        script: |
          brew install xcodegen
      - name: Generate Xcode project
        script: |
          cd "$CM_BUILD_DIR/ios"
          xcodegen generate
      - name: Resolve Swift packages
        script: |
          cd "$CM_BUILD_DIR/ios"
          xcodebuild -resolvePackageDependencies -project "$XCODE_PROJECT" -scheme "$XCODE_SCHEME"
      - name: Set build number
        script: |
          cd "$CM_BUILD_DIR/ios"
          agvtool new-version -all "$PROJECT_BUILD_NUMBER"
      - name: Set up code signing settings on Xcode project
        script: |
          xcode-project use-profiles --project "$CM_BUILD_DIR/ios/$XCODE_PROJECT"
      - name: Build ipa for distribution
        script: |
          xcode-project build-ipa \
            --project "$CM_BUILD_DIR/ios/$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
    publishing:
      email:
        recipients:
          - walter.farrar0@gmail.com
        notify:
          success: true
          failure: true
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        beta_groups:
          - App Store Connect Users

  ios-ipad-screenshot:
    name: iOS iPad screenshot
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      xcode: latest
      vars:
        BUNDLE_ID: "com.adplay.app"
        XCODE_PROJECT: AdPlay.xcodeproj
        XCODE_SCHEME: AdPlay
    scripts:
      - name: Generate Xcode project
        script: |
          brew install xcodegen
          cd "$CM_BUILD_DIR/ios"
          xcodegen generate
      - name: Boot 13-inch iPad
        script: |
          set -euo pipefail
          xcrun simctl shutdown all || true
          DEVICE_TYPE=$(xcrun simctl list -j devicetypes | python3 -c '
          import json, sys
          types = json.load(sys.stdin)["devicetypes"]
          for t in types:
              n = t["name"].lower()
              if "ipad" in n and "13-inch" in n:
                  print(t["identifier"])
                  raise SystemExit
          raise SystemExit("No 13-inch iPad simulator device type")
          ')
          RUNTIME=$(xcrun simctl list -j runtimes | python3 -c '
          import json, sys
          runs = [r for r in json.load(sys.stdin)["runtimes"]
                  if r.get("isAvailable") and "iOS" in r.get("name", "")]
          if not runs:
              raise SystemExit("No iOS simulator runtime")
          print(runs[-1]["identifier"])
          ')
          UDID=$(xcrun simctl create "AdPlay iPad 13" "$DEVICE_TYPE" "$RUNTIME")
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl status_bar "$UDID" override --time "9:41" --batteryState charged --batteryLevel 100
          printf '%s' "$UDID" > "$CM_BUILD_DIR/ios/.sim_udid"
          echo "Booted $DEVICE_TYPE / $RUNTIME / $UDID"
      - name: Build Release for simulator
        script: |
          set -euo pipefail
          UDID=$(cat "$CM_BUILD_DIR/ios/.sim_udid")
          cd "$CM_BUILD_DIR/ios"
          xcodebuild -resolvePackageDependencies -project "$XCODE_PROJECT" -scheme "$XCODE_SCHEME"
          xcodebuild build \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -sdk iphonesimulator \
            -destination "id=$UDID" \
            -configuration Release \
            -derivedDataPath "$CM_BUILD_DIR/ios/build" \
            CODE_SIGNING_ALLOWED=NO
      - name: Launch Play and screenshot
        script: |
          set -euo pipefail
          UDID=$(cat "$CM_BUILD_DIR/ios/.sim_udid")
          APP="$CM_BUILD_DIR/ios/build/Build/Products/Release-iphonesimulator/AdPlay.app"
          xcrun simctl install "$UDID" "$APP"
          xcrun simctl spawn "$UDID" defaults write "$BUNDLE_ID" adplay.hasCompletedOnboarding -bool true
          xcrun simctl privacy "$UDID" grant tracking "$BUNDLE_ID" || true
          xcrun simctl launch "$UDID" "$BUNDLE_ID"
          sleep 18
          mkdir -p "$CM_BUILD_DIR/screenshots"
          xcrun simctl io "$UDID" screenshot "$CM_BUILD_DIR/screenshots/ipad-13-play.png"
          sips -g pixelWidth -g pixelHeight "$CM_BUILD_DIR/screenshots/ipad-13-play.png"
    artifacts:
      - screenshots/*.png
      - /tmp/xcodebuild_logs/*.log
    publishing:
      email:
        recipients:
          - walter.farrar0@gmail.com
        notify:
          success: true
          failure: true
