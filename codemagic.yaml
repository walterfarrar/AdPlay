workflows:
  ios-testflight:
    name: iOS TestFlight Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Codemagic
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.adplay.app
      xcode: latest
      vars:
        BUNDLE_ID: "com.adplay.app"
        XCODE_PROJECT: AdPlay.xcodeproj
        XCODE_SCHEME: AdPlay
    scripts:
      - name: Install XcodeGen
        script: |
          brew install xcodegen
      - name: Generate Xcode project
        script: |
          cd "$CM_BUILD_DIR/ios"
          xcodegen generate
      - name: Set build number
        script: |
          cd "$CM_BUILD_DIR/ios"
          agvtool new-version -all "$PROJECT_BUILD_NUMBER"
      - name: Set up code signing settings on Xcode project
        script: |
          xcode-project use-profiles --project "$CM_BUILD_DIR/ios/$XCODE_PROJECT"
      - name: Build ipa for distribution
        script: |
          xcode-project build-ipa \
            --project "$CM_BUILD_DIR/ios/$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
    publishing:
      email:
        recipients:
          - walter.farrar0@gmail.com
        notify:
          success: true
          failure: true
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        beta_groups:
          - App Store Connect Users
