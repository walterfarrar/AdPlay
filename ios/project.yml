name: AdPlay
options:
  bundleIdPrefix: com.adplay
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
packages:
  firebase-ios-sdk:
    url: https://github.com/firebase/firebase-ios-sdk
    from: 11.0.0
  google-mobile-ads:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads.git
    from: 12.0.0
targets:
  AdPlay:
    type: application
    platform: iOS
    sources:
      - path: AdPlay
        excludes:
          - Info.plist
          - AdPlay.entitlements
    dependencies:
      - package: firebase-ios-sdk
        product: FirebaseCore
      - package: firebase-ios-sdk
        product: FirebaseAuth
      - package: firebase-ios-sdk
        product: FirebaseFunctions
      - package: google-mobile-ads
        product: GoogleMobileAds
      - sdk: AppTrackingTransparency.framework
      - sdk: AuthenticationServices.framework
      - sdk: StoreKit.framework
      - sdk: GameKit.framework
      - sdk: ActivityKit.framework
    entitlements:
      path: AdPlay/AdPlay.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.adplay.app
        CODE_SIGN_ENTITLEMENTS: AdPlay/AdPlay.entitlements
        INFOPLIST_FILE: AdPlay/Info.plist
        GENERATE_INFOPLIST_FILE: false
        TARGETED_DEVICE_FAMILY: "1,2"
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "1.0.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        DEVELOPMENT_TEAM: KGT8E4849W
        # Required by Google Mobile Ads (AppMeasurement categories) — missing this crashes at launch.
        OTHER_LDFLAGS: $(inherited) -ObjC
      configs:
        # Compile-gates Skip ads bypass. Release / TestFlight omit this flag.
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) DEBUG_BYPASS_ADS
    info:
      path: AdPlay/Info.plist
      properties:
        CFBundleDisplayName: AdPlay
        UILaunchScreen: {}
        ITSAppUsesNonExemptEncryption: false
        NSUserTrackingUsageDescription: AdPlay uses this identifier to show relevant rewarded ads and measure ad performance.
        GADApplicationIdentifier: ca-app-pub-1524015618608684~3874360461
        # Required on the unsuffixed key for iPad multitasking (ASC 90474).
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        "UISupportedInterfaceOrientations~iphone":
          - UIInterfaceOrientationPortrait
        "UISupportedInterfaceOrientations~ipad":
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
