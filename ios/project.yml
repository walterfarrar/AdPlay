name: AdPlay
options:
  bundleIdPrefix: com.adplay
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
packages:
  firebase-ios-sdk:
    url: https://github.com/firebase/firebase-ios-sdk
    from: 11.0.0
targets:
  AdPlay:
    type: application
    platform: iOS
    sources:
      - path: AdPlay
        excludes:
          - Info.plist
    dependencies:
      - package: firebase-ios-sdk
        product: FirebaseCore
      - package: firebase-ios-sdk
        product: FirebaseAuth
      - package: firebase-ios-sdk
        product: FirebaseFunctions
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.adplay.app
        INFOPLIST_FILE: AdPlay/Info.plist
        GENERATE_INFOPLIST_FILE: false
        TARGETED_DEVICE_FAMILY: "1"
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "1.0.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        DEVELOPMENT_TEAM: KGT8E4849W
      configs:
        # Optional local override; UI gate is tunables.debugReset (works in TestFlight too).
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) DEBUG_BYPASS_ADS
    info:
      path: AdPlay/Info.plist
      properties:
        CFBundleDisplayName: AdPlay
        UILaunchScreen: {}
        ITSAppUsesNonExemptEncryption: false
