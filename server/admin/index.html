<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AdPlay Admin — Lightning payouts</title>
  <style>
    :root {
      --bg: #0f1419;
      --panel: #1a222c;
      --text: #e8eef4;
      --muted: #8b9aab;
      --accent: #f7931a;
      --ok: #3dd68c;
      --bad: #f07178;
      --line: #2a3542;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "IBM Plex Sans", "Segoe UI", sans-serif;
      background: radial-gradient(1200px 600px at 10% -10%, #243041 0%, var(--bg) 55%);
      color: var(--text);
      min-height: 100vh;
    }
    header {
      padding: 1.5rem 1.75rem 0.5rem;
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      align-items: end;
      justify-content: space-between;
    }
    h1 {
      margin: 0;
      font-size: 1.35rem;
      font-weight: 600;
      letter-spacing: -0.02em;
    }
    h1 span { color: var(--accent); }
    .controls { display: flex; gap: 0.5rem; flex-wrap: wrap; align-items: center; }
    input, select, button, textarea {
      font: inherit;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--text);
      padding: 0.55rem 0.75rem;
    }
    button {
      cursor: pointer;
      background: var(--accent);
      color: #1a1208;
      border: none;
      font-weight: 600;
    }
    button.secondary { background: transparent; color: var(--text); border: 1px solid var(--line); }
    button.danger { background: var(--bad); color: #1a0a0c; }
    main { padding: 1rem 1.75rem 2.5rem; }
    .hint { color: var(--muted); font-size: 0.9rem; margin: 0 0 1rem; max-width: 48rem; }
    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 1rem 1.1rem;
      margin-bottom: 0.85rem;
    }
    .meta { color: var(--muted); font-size: 0.85rem; margin-top: 0.35rem; }
    .bolt {
      font-family: ui-monospace, "Cascadia Code", monospace;
      font-size: 0.78rem;
      word-break: break-all;
      background: #0c1015;
      padding: 0.65rem 0.75rem;
      border-radius: 8px;
      margin: 0.65rem 0;
      border: 1px solid var(--line);
    }
    .row { display: flex; gap: 0.5rem; flex-wrap: wrap; align-items: center; }
    .amount { font-size: 1.25rem; font-weight: 650; color: var(--accent); }
    .empty { color: var(--muted); padding: 2rem 0; }
    .status { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ok); }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>AdPlay <span>Admin</span></h1>
      <p class="hint" style="margin-top:0.4rem">Pay pending Lightning invoices from your wallet, then mark paid.</p>
    </div>
    <div class="controls">
      <input id="token" type="password" placeholder="Admin token" style="min-width:14rem" />
      <select id="status">
        <option value="pending">Pending</option>
        <option value="paid">Paid</option>
        <option value="rejected">Rejected</option>
      </select>
      <button type="button" id="refresh">Refresh</button>
    </div>
  </header>
  <main>
    <p class="hint">1) Copy BOLT11 → pay in Phoenix / Zeus / Alby. 2) Mark Paid with optional payment hash note. Reject refunds held sats to the user.</p>
    <div id="list"></div>
  </main>
  <script>
    const $ = (id) => document.getElementById(id);
    const tokenInput = $("token");
    tokenInput.value = localStorage.getItem("adplay_admin_token") || "";

    async function api(path, opts = {}) {
      const token = tokenInput.value.trim();
      localStorage.setItem("adplay_admin_token", token);
      const res = await fetch(path, {
        ...opts,
        headers: {
          "Content-Type": "application/json",
          "X-Admin-Token": token,
          ...(opts.headers || {}),
        },
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || res.statusText);
      return data;
    }

    async function load() {
      const list = $("list");
      list.innerHTML = "<p class='empty'>Loading…</p>";
      try {
        const status = $("status").value;
        const { withdrawals } = await api(`/admin/api/withdrawals?status=${status}`);
        if (!withdrawals.length) {
          list.innerHTML = "<p class='empty'>No withdrawals in this filter.</p>";
          return;
        }
        list.innerHTML = withdrawals.map((w) => `
          <article class="card" data-id="${w.id}">
            <div class="row" style="justify-content:space-between">
              <div class="amount">${w.amount_sats} sats</div>
              <div class="status">${w.status}</div>
            </div>
            <div class="meta">${w.display_name || "Player"} · ${w.apple_sub || w.user_id} · ${w.created_at}</div>
            <div class="bolt">${w.bolt11}</div>
            ${w.admin_note ? `<div class="meta">Note: ${escapeHtml(w.admin_note)}</div>` : ""}
            ${w.status === "pending" ? `
              <div class="row">
                <button type="button" class="copy">Copy invoice</button>
                <button type="button" class="paid">Mark paid</button>
                <button type="button" class="danger reject">Reject + refund</button>
              </div>
            ` : ""}
          </article>
        `).join("");

        list.querySelectorAll(".copy").forEach((btn) => {
          btn.addEventListener("click", async () => {
            const bolt = btn.closest(".card").querySelector(".bolt").textContent;
            await navigator.clipboard.writeText(bolt);
            btn.textContent = "Copied";
            setTimeout(() => (btn.textContent = "Copy invoice"), 1200);
          });
        });
        list.querySelectorAll(".paid").forEach((btn) => {
          btn.addEventListener("click", async () => {
            const id = btn.closest(".card").dataset.id;
            const note = prompt("Optional note (payment hash):") || undefined;
            await api(`/admin/api/withdrawals/${id}/paid`, {
              method: "POST",
              body: JSON.stringify({ note }),
            });
            load();
          });
        });
        list.querySelectorAll(".reject").forEach((btn) => {
          btn.addEventListener("click", async () => {
            const id = btn.closest(".card").dataset.id;
            if (!confirm("Reject and refund sats to user?")) return;
            const note = prompt("Reason:") || undefined;
            await api(`/admin/api/withdrawals/${id}/reject`, {
              method: "POST",
              body: JSON.stringify({ note }),
            });
            load();
          });
        });
      } catch (e) {
        list.innerHTML = `<p class="empty" style="color:var(--bad)">${escapeHtml(e.message)}</p>`;
      }
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, (c) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
      })[c]);
    }

    $("refresh").addEventListener("click", load);
    $("status").addEventListener("change", load);
    tokenInput.addEventListener("change", load);
    load();
  </script>
</body>
</html>
